<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>News Sentiment Analysis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Sans:wght@500;600;700&amp;display=swap">
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" th:href="@{/css/nlp.css}"/>
</head>
<body>

    <header class="navbar">
        <div class="nav-title">
            <svg class="icon" aria-hidden="true"><use th:href="@{/img/icons.svg#logo}"></use></svg>
            Digital Asset Analytics
        </div>
        <button class="nav-toggle" type="button" aria-label="Toggle navigation"
                aria-expanded="false" aria-controls="nav-links">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav class="nav-links" id="nav-links">
            <a th:href="@{/}">Markets</a>
            <a th:href="@{/lstm-form}">Forecast</a>
            <a th:href="@{/nlp}">Sentiment</a>
        </nav>
    </header>

    <form method="GET" th:action="@{/nlp}" class="filter-box">
        <h1>
            <svg class="icon" aria-hidden="true"><use th:href="@{/img/icons.svg#sentiment}"></use></svg>
            NEWS SENTIMENT ANALYSIS
        </h1>

        <label>
            From:
            <input type="text" name="fromDate" th:value="${fromDate}">
        </label>

        <label>
            To:
            <input type="text" name="toDate" th:value="${toDate}">
        </label>

        <label>
            Limit:
            <input type="text" name="limit">
        </label>

        <button type="submit">Filter</button>
        <a th:href="@{/nlp}">Clear</a>
    </form>

    <div class="sentiment-summary">
        <p class="sentiment-note">
            Distribution based on transformer-based sentiment classification. <br/>
            <strong>DistilBERT</strong>
            (<em>distilbert-base-uncased-finetuned-sst-2-english</em>).
        </p>
        <div class="sentiment-chart">
            <canvas id="sentimentChart" th:data-positive="${positiveCount}" th:data-negative="${negativeCount}"></canvas>
        </div>
    </div>

    <div class="table-wrapper">
        <table class="table-slider">
            <thead>
            <tr>
                <th>Date</th>
                <th>Content</th>
                <th>Link</th>
                <th>Sentiment Label</th>
                <th>Sentiment Score</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="row : ${rows}">
                <td th:text="${row['date']}"></td>
                <td th:text="${row['content']}"></td>
                <td th:text="${row['link']}"></td>

                <td th:text="${row['sentiment_label']}"
                    th:classappend="${row['sentiment_label']} == 'POSITIVE'
                          ? 'sentiment-positive' : 'sentiment-negative'"></td>
                <td th:text="${#numbers.formatDecimal(row['sentiment_score'], 1, 4, 'POINT')}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <script th:src="@{/js/navbar.js}"></script>
    <script th:src="@{/js/nlp.js}"></script>

</body>
</html>
