<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${symbol}"></title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Sans:wght@500;600;700&amp;display=swap">
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" th:href="@{/css/coin.css}"/>
</head>
<body>

    <header class="navbar">
        <div class="nav-title">
            <svg class="icon" aria-hidden="true"><use th:href="@{/img/icons.svg#logo}"></use></svg>
            Digital Asset Analytics
        </div>
        <button class="nav-toggle" type="button" aria-label="Toggle navigation"
                aria-expanded="false" aria-controls="nav-links">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav class="nav-links" id="nav-links">
            <a th:href="@{/}">Markets</a>
            <a th:href="@{/lstm-form}">Forecast</a>
            <a th:href="@{/nlp}">Sentiment</a>
        </nav>
    </header>


    <h1>
        <svg class="icon" aria-hidden="true"><use th:href="@{/img/icons.svg#coin}"></use></svg>
        <span th:text="${symbol}"></span>
    </h1>

    <p th:if="${fromDate} != null and ${toDate} != null"
       th:text="'From ' + ${fromDate} + ' to ' + ${toDate}">
    </p>

    <h2 th:text="${symbol} + ' CLOSING PRICE (LAST YEAR)'"></h2>
    <canvas id="priceChart"></canvas>

    <h2>Daily Data (Last Year)</h2>
    <table>
        <thead>
        <tr>
            <th>Date</th>
            <th>Open</th>
            <th>High</th>
            <th>Low</th>
            <th>Close</th>
            <th>Volume</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row : ${rows}" th:data-date="${row.date}" th:data-close="${row.close}">
            <td th:text="${row.date}"></td>
            <td th:text="${row.open}"></td>
            <td th:text="${row.high}"></td>
            <td th:text="${row.low}"></td>
            <td th:text="${row.close}"></td>
            <td th:text="${row.volume}"></td>
        </tr>
        </tbody>
    </table>

    <script th:src="@{/js/navbar.js}"></script>
    <script th:src="@{/js/coin.js}"></script>

</body>
</html>
