<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Digital Asset Analytics System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Sans:wght@500;600;700&amp;display=swap">
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

    <header class="navbar">
        <div class="nav-title">
            <svg class="icon" aria-hidden="true"><use th:href="@{/img/icons.svg#logo}"></use></svg>
            Digital Asset Analytics
        </div>
        <button class="nav-toggle" type="button" aria-label="Toggle navigation"
                aria-expanded="false" aria-controls="nav-links">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav class="nav-links" id="nav-links">
            <a th:href="@{/}">Markets</a>
            <a th:href="@{/lstm-form}">Forecast</a>
            <a th:href="@{/nlp}">Sentiment</a>
        </nav>
    </header>

    <form method="GET" th:action="@{/}" class="filter-box">
        <h1>
            <svg class="icon" aria-hidden="true"><use th:href="@{/img/icons.svg#market}"></use></svg>
            MARKET DATA
        </h1>

        <label>
            Symbol:
            <input type="text" name="symbol">
        </label>

        <label>
            From:
            <input type="text" name="fromDate">
        </label>

        <label>
            To:
            <input type="text" name="toDate">
        </label>

        <label>
            Limit:
            <input type="text" name="limit" min="1">
        </label>

        <button type="submit">Filter</button>
        <a th:href="@{/}">Clear</a>
    </form>

    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Open</th>
                <th>High</th>
                <th>Low</th>
                <th>Close</th>
                <th>Volume</th>
                <th>Symbol</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="row : ${rows}">
                <td th:text="${row.date}"></td>
                <td th:text="${row.open}"></td>
                <td th:text="${row.high}"></td>
                <td th:text="${row.low}"></td>
                <td th:text="${row.close}"></td>
                <td th:text="${row.volume}"></td>
                <td>
                    <a th:href="@{/coin/{symbol}(symbol=${row.symbol})}"
                       th:text="${row.symbol.toUpperCase()}"></a>
                </td>
            </tr>
        </tbody>
    </table>

    <script th:src="@{/js/navbar.js}"></script>

</body>
</html>
